name: CI

on:
  push:
    # Every branch, not just master/develop — feature branches are where breakage lands.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same ref rather than queueing them.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" |
            tools/ci-decode-secret.sh app/google-services.json json

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" |
            tools/ci-decode-secret.sh app/release-keystore.jks binary

      # Compile explicitly and first, so a compilation break is reported as such instead of
      # surfacing partway through a longer assemble.
      - name: Compile Android sources
        run: ./gradlew :app:compileDebugKotlin

      - name: Compile shared module (common + Android)
        run: ./gradlew :shared:allMetadataJar :shared:compileAndroidMain

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug & release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  shared-and-ios:
    name: Shared tests & iOS build
    # Needs macOS. The shared module's tests target Kotlin/Native (iosSimulatorArm64,
    # iosX64), which Linux cannot build — on ubuntu those targets are silently disabled and
    # the tests do not run at all. Building the iOS app needs Xcode regardless.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" |
            tools/ci-decode-secret.sh app/google-services.json json

      # Optional: the iOS app compiles without it — a missing plist is a runtime failure, not
      # a build one — so a fork without the secret still gets a useful signal.
      - name: Decode GoogleService-Info.plist (if available)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" |
              tools/ci-decode-secret.sh iosApp/iosApp/GoogleService-Info.plist xml
          else
            echo "secret not set — skipping (the build does not require it)"
          fi

      # The shared tests — ReceiptTextParser, RecurringScheduleCalculator,
      # SmsTransactionParser. These never ran under the previous workflow: `./gradlew test`
      # covers only :app, and :shared:allTests is a no-op on Linux.
      - name: Run shared multiplatform tests
        run: ./gradlew :shared:allTests

      - name: Build shared framework for iOS
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS app
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          retention-days: 7
